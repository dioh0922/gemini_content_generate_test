<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div>
    <form action="./api/img/gen" method="get">
      <button type="submit">サンプル</button>
    </form>
  </div>
  <div>
    <form action="./api/img/gen" method="post">
      <textarea name="prompt"></textarea>
      <button type="submit">生成</button>
    </form>
    <div>
      <% images.forEach(function(image){ %>
        <img src="/generate/img/<%=image %>" alt="<%=image %>" width="20%">
      <% }); %>
    </div>
  </div>
</body>
</html>
